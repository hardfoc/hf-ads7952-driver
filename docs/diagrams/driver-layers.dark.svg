<text x="56" y="443.5" font-size="16" font-weight="700" fill="#C7CBFF">RawManualFrames()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">ADS7952&lt;SpiType&gt;, inc/ads7952.hpp</text>
<text x="56" y="544.4" font-size="20" font-weight="700" fill="#C7CBFF">SPI interface</text>
<text x="56" y="575" font-size="17" fill="#D2DAE4">SpiInterface&lt;Derived&gt; (CRTP): 16-bit frames, MSB first, one transfer per frame,</text>
<text x="56" y="599.7" font-size="17" fill="#D2DAE4">results keyed on the channel address in DO15:12, no heap, no virtual calls</text>
<text x="56" y="698.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="727.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">transfer(tx, rx, len)</text>
<text x="56" y="826.4" font-size="20" font-weight="700" fill="#E8EDF3">ADS7952</text>
<text x="56" y="857" font-size="17" fill="#D2DAE4">SPI mode 0 up to 20 MHz  /  CS, SCLK, SDI, SDO  /  12 inputs, 4 GPIOs</text>
